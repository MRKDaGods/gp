[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtmc-tracker"
version = "0.1.0"
description = "Multi-Camera City-Wide Tracking System for Vehicles and Humans"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}

dependencies = [
    # Core
    "numpy==2.3.5",
    "scipy==1.17.1",
    "pandas==2.3.3",

    # Configuration
    "omegaconf==2.3.0",
    "jsonschema==4.26.0",

    # Computer Vision - opencv-python-headless ONLY. Do not add opencv-python
    # (GUI build): both packages install into the same `cv2/` site-packages
    # directory and corrupt each other. See requirements.txt for details.
    "opencv-python-headless==5.0.0.93",
    "Pillow==12.0.0",

    # Detection
    "ultralytics==8.4.23",

    # boxmot is intentionally excluded from this list. It MUST be installed
    # separately and with --no-deps:
    #     pip install --no-deps boxmot==12.0.2
    # boxmot's own metadata hard-pins an old numpy/lapx/regex/torchvision
    # that conflicts with the versions pinned here (and has no Python 3.13
    # wheel), so a normal resolved install fails. Cap below 13: boxmot 13+
    # restructured its API and renamed tracker classes, which breaks Stage 1
    # (src/stage1_tracking/tracker.py). See requirements.txt for the full
    # install order.

    # Deep Learning - these are the PyPI CPU builds. For GPU, reinstall after
    # with: pip install torch==2.6.0+cu124 torchvision==0.21.0+cu124
    # --index-url https://download.pytorch.org/whl/cu124  (verified working
    # combination: CUDA 12.4, torch 2.6.0, torchvision 0.21.0).
    "torch==2.6.0",
    "torchvision==0.21.0",
    "open-clip-torch==3.3.0",

    # Indexing
    "faiss-cpu==1.13.2",

    # Graphs
    "networkx==3.6.1",

    # Visualization
    "matplotlib==3.10.8",
    "plotly==6.6.0",
    "seaborn==0.13.2",

    # Web Dashboard
    "streamlit==1.59.1",

    # NL Query
    "sentence-transformers==5.3.0",

    # Utilities
    "tqdm==4.67.3",
    "loguru==0.7.3",
    "click==8.3.1",
    "rich==15.0.0",
    "kaggle==2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "nbformat>=5.9",
    "ruff>=0.1",
]
reid = [
    "gdown==5.2.1",
]
lpr = [
    "paddleocr>=2.7",
]

[project.scripts]
mtmc-run = "scripts.run_pipeline:main"
mtmc-stage = "scripts.run_stage:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: tests that instantiate large pretrained backbones",
    "requires_network: tests that may download model weights on first run",
]
