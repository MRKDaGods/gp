    size_bytes: 1217428513
    sets: [vehicle-mtmc-14e, vehicle-mtmc-14k]
    note: DINOv2 ViT-L/14 tertiary ReID stream (CityFlowV2 score fusion).

  - name: fastreid_r50_ibn_cityflowv2_final.pth
