# -----------------------------------------------------------------------------
# Pipeline weight manifest - single source of truth for downloadable checkpoints.
#
# All required weights are consolidated into ONE public Kaggle dataset so that a
# fresh clone can fetch everything needed to run the pipeline and reproduce the
# VeRi-776 results. Download with:
#
#     python scripts/download_weights.py            # interactive set picker
#     python scripts/download_weights.py --set all  # everything
#     python scripts/download_weights.py --set veri  # just the VeRi-776 paper streams
#
# Each file is SHA-256 pinned; the downloader verifies integrity after fetch.
# `name` is the (flat) filename inside the Kaggle dataset; `local_path` is where
# the file is placed in the repo (matches configs/model_registry.yaml).
# -----------------------------------------------------------------------------
version: 1
kaggle_dataset: mrkdagods/mtmc-veri776-pipeline-weights
license: CC-BY-4.0

sets:
  vehicle-mtmc-14e:
    description: >-
      Vehicle MTMC 14e B1 production (CityFlowV2): YOLO26m detector, OSNet tracker
      ReID, TransReID ViT-B/16 CLIP primary, and DINOv2-Large tertiary streams.
    registry_models: [vehicle_mtmc_14e_b1, cityflow_transreid]
  vehicle-mtmc-14k:
    description: >-
      Vehicle MTMC 14k v1 K7 R50-IBN research stack: everything in vehicle-mtmc-14e
      plus the FastReID ResNet50-IBN quaternary stream.
    registry_models: [vehicle_mtmc_14k_v1_k7]
  person-mtmc:
    description: >-
      Person MTMC 12b production (WILDTRACK): MVDeTr multiview ground-plane detector.
    registry_models: [person_mtmc_12b, person_detector_12a_mvdetr]
  veri:
    description: >-
      VeRi-776 paper two-stream fusion (93.32% mAP / 98.45% Rank-1): TransReID
      ViT-B/16 CLIP (Stream 1) and CLIP-SENet v6 (Stream 2).
    registry_models: [veri776_14t_fusion, veri776_09v_v17_transreid, veri776_clipsenet_v6]

files:
  - name: yolo26m.pt
    local_path: models/detection/yolo26m.pt
    sha256: 401cea9ab23ad19246ff7744859816bc599f350e93c9dd30367b6f0a0745d0b7
    size_bytes: 44255705
    sets: [vehicle-mtmc-14e, vehicle-mtmc-14k]
    note: YOLO26m vehicle detector (Stage 1).

  - name: osnet_x0_25_msmt17.pt
    local_path: models/tracker/osnet_x0_25_msmt17.pt
    sha256: 6f57607fed9f502b9efed546108132ee715df5a5b6e6932c6269bacb47f59f99
    size_bytes: 3057863
    sets: [vehicle-mtmc-14e, vehicle-mtmc-14k]
    note: BoxMOT OSNet tracker ReID weights (Stage 1 tracking).

  - name: transreid_cityflowv2_best.pth
    local_path: models/reid/transreid_cityflowv2_best.pth
    sha256: 3d477e2530dd53f9e303cdef9ab78609d7d5c5a500258c2478e7b50eee44378f
    size_bytes: 346518635
